name: Release

# tag 推送（v*）：打包扩展 zip 发 GitHub Release；npm 发布（需 NPM_TOKEN secret，未配置则跳过）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package extension zips
        run: node scripts/package.mjs
      # step if 不允许 secrets 上下文：先探测并写入 GITHUB_ENV
      - name: Check NPM_TOKEN configured
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN_SET=true" >> "$GITHUB_ENV"
          fi
      - name: Publish to npm
        if: env.NPM_TOKEN_SET == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 只发布 gateway（protocol 由 esbuild 打进 bundle，是 workspace 内部包）
          ver=$(node -p "require('./packages/gateway/package.json').version")
          if npm view "browser-bridge-gateway@$ver" version >/dev/null 2>&1; then
            echo "browser-bridge-gateway@$ver 已在 npm 上，跳过"
          else
            pnpm --filter browser-bridge-gateway publish --access public --no-git-checks
          fi
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/*.zip --clobber
          else
            gh release create "$TAG" dist-release/*.zip \
              --title "browser-bridge $TAG" \
              --notes "扩展安装包：chromium 解压后「加载已解压的扩展程序」；firefox 解压后 about:debugging 临时载入 manifest.json。gateway：npx browser-bridge-gateway@$TAG serve。完整文档：https://jeffkit.github.io/browser-bridge/"
          fi
